# Included inside nginx's http {} block.
server_tokens off;

# Behind a Cloudflare Tunnel every request arrives from cloudflared. Use the visitor's real IP
# (for rate limiting, lockouts and the audit log) from CF-Connecting-IP, but trust that header
# only when the request comes from a private network (cloudflared on this host or in compose).
set_real_ip_from 127.0.0.1;
set_real_ip_from ::1;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
set_real_ip_from fc00::/7;
real_ip_header CF-Connecting-IP;

upstream loop_api {
  server api:3000;
  keepalive 16;
}

# Respect X-Forwarded-Proto from an outer TLS proxy, otherwise use our own scheme.
map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  ''      $scheme;
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 4m;

  # --- Security headers (inherited by every location without its own add_header) ---
  add_header X-Content-Type-Options "nosniff" always;
  # Framing policy from FRAME_ANCESTORS: sets $frame_ancestors and, when framing is off,
  # X-Frame-Options (written by /docker-entrypoint.d/40-loop-coder-frame-policy.sh).
  include /tmp/nginx/frame-policy.conf;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  # Only honoured by browsers over HTTPS (e.g. via Cloudflare); ignored on http://localhost.
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors $frame_ancestors; base-uri 'self'; form-action 'self'; object-src 'none'" always;

  location = /nginx-health {
    access_log off;
    default_type text/plain;
    return 200 "ok";
  }

  # Live board updates (Server-Sent Events): never buffer, keep the stream open.
  location ~ ^/api/projects/[^/]+/events$ {
    proxy_pass http://loop_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
  }

  location /api/ {
    proxy_pass http://loop_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    # Overwrite (not append) so clients cannot spoof their IP for rate limiting.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_read_timeout 120s;
  }

  # MCP endpoint for Claude Code (Streamable HTTP).
  location = /mcp {
    proxy_pass http://loop_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_buffering off;
    proxy_read_timeout 1h;
  }

  location = /healthz {
    proxy_pass http://loop_api;
  }

  # Fingerprinted build assets: cache forever (`expires` keeps the security headers).
  location /assets/ {
    expires 1y;
    access_log off;
    try_files $uri =404;
  }

  location = /index.html {
    expires -1;
  }

  # Single-page app routing.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
